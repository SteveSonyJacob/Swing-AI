# Configuration for Agent 1 — Market-Wide Stock Discovery Engine
# Focus: Market-wide discovery of eligible NSE-listed equities without ranking or scoring

market: "NSE"
country: "India"

universe:
  # Default mode is broad_market (all listed ordinary equities on NSE)
  mode: "broad_market"
  primary_source_url: "https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv"
  fallback_source_url: "https://archives.nseindia.com/content/equities/EQUITY_L.csv"
  cache_file: "data/raw/nse_equity_universe.json"
  cache_ttl_hours: 24
  auto_refresh_on_expiry: true
  
  # Instrument series restrictions
  # EQ = Compulsory rolling settlement ordinary equities
  # BE = Book Entry (trade-for-trade / surveillance settlement)
  allowed_series:
    - "EQ"
    - "BE"
  
  # Excluded instrument categories: indices, ETFs, debt, bonds, debentures, warrants
  exclude_derivatives_only: true
  exclude_indices: true
  exclude_etfs: true
  exclude_debt: true

# Optional eligibility constraints (disabled by default; scanner discovers all equities unless enabled)
eligibility:
  enabled: false
  min_price: null              # e.g., 20.0 to exclude penny stocks if explicitly configured
  preferred_min_price: null    # e.g., 100.0 if explicitly configured
  min_avg_daily_volume: null   # e.g., 100000 if explicitly configured
  min_turnover_cr: null        # e.g., 5.0 (₹ Cr) if explicitly configured

# Downstream orchestration settings (configured independently of screening discovery)
orchestration:
  max_symbols_to_analyze: 10   # Maximum symbols to evaluate in downstream Technical and Fundamental engines
  selection_policy: "first_n_discovered"  # Explicit, deterministic selection policy (not based on ranking)

# Provider network settings
network:
  timeout: 10
  retries: 3
  rate_limit_backoff_sec: 1.0
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

