# Configuration for Agent 1 — Screening Agent

scoring:
  weights:
    trend: 25
    momentum_breakout: 25
    volume: 25
    liquidity: 15
    catalyst: 10

  categories:
    weak_max: 30
    neutral_max: 50
    watch_max: 70
    strong_max: 85
    prime_setup_max: 100

thresholds:
  price:
    min_price: 20.0
    preferred_min_price: 100.0
  liquidity:
    min_avg_daily_volume: 100000
    min_turnover_cr: 5.0  # Min daily turnover in Crores (₹ Cr)
  technical:
    rsi_min: 50.0
    rsi_max: 75.0
    proximity_52w_high_pct: 5.0  # Within 5% of 52-week high
    breakout_lookback_days: 20
  volume:
    surge_multiplier: 1.3        # Relative volume > 1.3x 20-day SMA
    shocker_multiplier: 2.0      # Relative volume > 2.0x 20-day SMA
  catalyst:
    earnings_lookahead_days: 14

moneycontrol:
  base_url: "https://www.moneycontrol.com"
  endpoints:
    top_gainers: "https://www.moneycontrol.com/stocks/market-stats/top-gainers-nse/"
    volume_shockers: "https://www.moneycontrol.com/stocks/market-stats/volume-shockers-nse/"
    52_week_high: "https://www.moneycontrol.com/stocks/market-stats/52-week-high-nse/"
    most_active: "https://www.moneycontrol.com/stocks/market-stats/most-active-stocks-nse/"
    top_losers: "https://www.moneycontrol.com/stocks/market-stats/top-losers-nse/"
    corporate_actions: "https://www.moneycontrol.com/markets/corporate-action/board-meetings/"
  request:
    timeout: 10
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

